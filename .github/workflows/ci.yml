name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_NOLOGO: 1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all history
          # lib/battlescribe-spec is a public repository, so the default token can
          # clone it. Do not reintroduce a GitHub App token here: secrets are not
          # exposed to Dependabot-triggered runs, so the token step fails and takes
          # every Dependabot PR's CI down with it.
          submodules: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet --info
      - run: dotnet tool restore
      - run: dotnet nbgv get-version
      - run: dotnet restore -v m
      - run: dotnet build --no-restore
      - run: dotnet test --no-build
      - run: dotnet pack
      - name: Publish NuGet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nugets-${{ runner.os }}
          path: artifacts/package/release
